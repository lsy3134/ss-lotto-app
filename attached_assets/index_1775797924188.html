<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 당첨번호 필터링 추출기</title>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f7f9;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      text-align: center;
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
    }
    h1 {
      color: #333;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    .status {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
      background: #eee;
      padding: 8px 12px;
      border-radius: 15px;
      display: inline-block;
    }
    #numbers {
      display: flex;
      gap: 8px;
      margin: 25px 0;
      min-height: 50px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .ball {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      background: #222;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background: #444;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #log {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #666;
      line-height: 1.5;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 스마트 번호 추출기</h1>
    <div class="status" id="status">📂 엑셀 데이터 불러오는 중...</div>
    <div id="numbers"></div>
    <button id="generateBtn" onclick="generateUniqueNumbers()" disabled>번호 생성</button>
    <div id="log"></div>
  </div>

  <!-- SheetJS CDN -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

  <script>
    const pastWinners = new Set();
    let isDataLoaded = false;

    function getColor(num) {
      if (num <= 10) return '#fbc400';
      if (num <= 20) return '#69c8f2';
      if (num <= 30) return '#ff7272';
      if (num <= 40) return '#aaa';
      return '#b0d840';
    }

    async function loadExcelData() {
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      const button = document.getElementById('generateBtn');

      try {
        const response = await fetch('./lotto.xlsx');
        if (!response.ok) {
          throw new Error('lotto.xlsx 파일을 찾을 수 없습니다.');
        }

        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });

        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet, { defval: null });

        let validCount = 0;

        rows.forEach((row) => {
          const nums = [
            row['당첨번호'],
            row['Unnamed: 3'],
            row['Unnamed: 4'],
            row['Unnamed: 5'],
            row['Unnamed: 6'],
            row['Unnamed: 7']
          ]
          .map(v => Number(v))
          .filter(v => Number.isInteger(v) && v >= 1 && v <= 45)
          .sort((a, b) => a - b);

          if (nums.length === 6) {
            pastWinners.add(nums.join(','));
            validCount++;
          }
        });

        isDataLoaded = true;
        button.disabled = false;
        status.textContent = `✅ 과거 당첨번호 ${validCount}개 조합 로딩 완료`;
        log.textContent = `엑셀 대조 준비 완료\n이제 과거 당첨 조합을 제외하고 번호를 생성합니다.`;
      } catch (error) {
        console.error(error);
        status.textContent = '❌ 엑셀 로딩 실패';
        log.textContent = `오류: ${error.message}\n파일명을 lotto.xlsx로 맞춰서 같은 폴더에 넣어주세요.`;
      }
    }

    function generateUniqueNumbers() {
      const container = document.getElementById('numbers');
      const log = document.getElementById('log');

      if (!isDataLoaded) {
        log.textContent = '아직 엑셀 데이터를 불러오지 못했습니다.';
        return;
      }

      let attempts = 0;
      let selectedNumbers = [];
      let isUnique = false;

      while (!isUnique && attempts < 10000) {
        attempts++;

        const temp = [];
        while (temp.length < 6) {
          const num = Math.floor(Math.random() * 45) + 1;
          if (!temp.includes(num)) temp.push(num);
        }

        temp.sort((a, b) => a - b);
        const comboKey = temp.join(',');

        if (!pastWinners.has(comboKey)) {
          selectedNumbers = temp;
          isUnique = true;
        }
      }

      container.innerHTML = '';

      if (!isUnique) {
        log.textContent = `생성 실패: 10,000회 시도 후 중단`;
        return;
      }

      selectedNumbers.forEach((num, index) => {
        setTimeout(() => {
          const ball = document.createElement('div');
          ball.className = 'ball';
          ball.style.backgroundColor = getColor(num);
          ball.innerText = num;
          container.appendChild(ball);
        }, index * 80);
      });

      log.textContent =
        `추천 번호: ${selectedNumbers.join(', ')}\n` +
        `검증 완료: 과거 당첨 조합과 중복 없음\n` +
        `시도 횟수: ${attempts}회`;
    }

    loadExcelData();
  </script>
</body>
</html>
