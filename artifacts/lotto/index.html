<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: notch/safe-area 대응 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />

    <!-- PWA: color-scheme (라이트 전용) -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1a1a2e" />

    <!-- PWA: Web App Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- iOS PWA 대응 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SS앱" />
    <link rel="apple-touch-icon" href="icon.png" />

    <!-- Windows Tile -->
    <meta name="msapplication-TileColor" content="#1a1a2e" />
    <meta name="msapplication-TileImage" content="icon.png" />

    <!-- SEO / OG -->
    <title>SS앱</title>
    <meta name="description" content="캐디 근무표 & 스마트 배정 도우미" />

    <link rel="icon" href="icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* ── 라이트 모드 강제 ── */
      :root {
        color-scheme: light;
        --bg-dark:      #1a1a2e;
        --bg-mid:       #16213e;
        --accent-blue:  #4e89ae;
        --accent-gold:  #f8b400;
        --accent-green: #52de97;
        --card-bg:      #ffffff;
        --page-bg:      #eef2f7;
        --text-main:    #1a1a2e;
        --text-sub:     #6b7280;
        --radius-lg:    16px;
        --radius-md:    10px;
        --shadow-card:  0 2px 12px rgba(26,26,46,0.08);
        /* iOS Safe Area */
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      /* 다크모드 비활성화 */
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: light; }
        html { background: #eef2f7; color: #1a1a2e; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow-x: hidden; }
      body {
        background: var(--page-bg);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        /* iOS standalone 하단 여백 */
        padding-bottom: var(--sab);
      }
      #root { min-height: 100dvh; }

      /* ── Animations ── */
      @keyframes floatBob {
        0%,100% { transform: translateY(0px); }
        50%      { transform: translateY(-6px); }
      }
      @keyframes glowPulse {
        0%,100% { box-shadow: 0 0 0 0 rgba(78,137,174,0.4); }
        50%      { box-shadow: 0 0 0 6px rgba(78,137,174,0); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
      }

      /* ── 안드로이드 설치 배너 ── */
      #pwa-install-banner {
        display: none;
        position: fixed;
        bottom: calc(16px + var(--sab));
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #1a1a2e, #4e89ae);
        color: white;
        padding: 12px 20px;
        border-radius: 14px;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        box-shadow: 0 6px 24px rgba(26,26,46,0.4);
        z-index: 9999;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
        animation: slideUp 0.3s ease;
        cursor: pointer;
      }
      #pwa-install-banner.visible { display: flex; }
      #pwa-install-banner button {
        background: #f8b400;
        border: none;
        color: #1a1a2e;
        padding: 7px 14px;
        border-radius: 8px;
        font-weight: 800;
        font-size: 0.82rem;
        cursor: pointer;
      }
      #pwa-install-close {
        background: none !important;
        color: rgba(255,255,255,0.6) !important;
        padding: 4px 6px !important;
        border-radius: 4px !important;
        font-size: 1rem !important;
      }

      /* ── iOS 설치 안내 배너 ── */
      #ios-install-banner {
        display: none;
        position: fixed;
        bottom: calc(0px + var(--sab));
        left: 0; right: 0;
        background: #fff;
        border-top: 1px solid #e5e7eb;
        border-radius: 20px 20px 0 0;
        padding: 18px 20px calc(18px + var(--sab));
        z-index: 9999;
        box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
        font-family: 'Inter', sans-serif;
        animation: slideUp 0.3s ease;
      }
      #ios-install-banner.visible { display: block; }
      #ios-install-banner .ios-title {
        font-size: 1rem; font-weight: 800; color: #1a1a2e;
        display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      }
      #ios-install-banner .ios-steps {
        display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
      }
      #ios-install-banner .ios-step {
        display: flex; align-items: center; gap: 10px;
        font-size: 0.88rem; color: #374151;
      }
      #ios-install-banner .ios-step-num {
        width: 24px; height: 24px; border-radius: 50%;
        background: #1a1a2e; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.75rem; font-weight: 800; flex-shrink: 0;
      }
      #ios-install-banner .ios-icon {
        display: inline-block;
        background: #007aff; color: #fff;
        border-radius: 6px; padding: 1px 6px;
        font-size: 0.85rem; font-weight: 700;
      }
      #ios-install-close-btn {
        width: 100%; padding: 12px; border: none;
        background: #f3f4f6; border-radius: 12px;
        font-size: 0.9rem; font-weight: 700; color: #6b7280;
        cursor: pointer;
      }

      @media print {
        body * { visibility: hidden; }
        #print-area, #print-area * { visibility: visible; }
        #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        button { display: none !important; }
        #pwa-install-banner { display: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- 안드로이드 PWA 설치 배너 -->
    <div id="pwa-install-banner" aria-label="앱 설치 배너">
      <span>📲 SS앱 홈 화면에 추가</span>
      <button id="pwa-install-btn">설치</button>
      <button id="pwa-install-close">✕</button>
    </div>

    <!-- iOS 설치 안내 배너 -->
    <div id="ios-install-banner" aria-label="iOS 설치 안내">
      <div class="ios-title">📲 SS앱 홈 화면에 추가하기</div>
      <div class="ios-steps">
        <div class="ios-step">
          <div class="ios-step-num">1</div>
          <span>하단 <span class="ios-icon">공유 □↑</span> 버튼을 탭하세요</span>
        </div>
        <div class="ios-step">
          <div class="ios-step-num">2</div>
          <span>스크롤해서 <strong>「홈 화면에 추가」</strong> 를 탭하세요</span>
        </div>
        <div class="ios-step">
          <div class="ios-step-num">3</div>
          <span>우측 상단 <strong>「추가」</strong> 를 탭하면 완료!</span>
        </div>
      </div>
      <button id="ios-install-close-btn">닫기</button>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker 등록 + PWA 설치 처리 -->
    <script>
      (function () {
        'use strict';

        // ── Service Worker 등록 ──────────────────────────────
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('./sw.js', { scope: './' })
              .then(function (reg) {
                console.log('[SW] registered, scope:', reg.scope);
              })
              .catch(function (err) {
                console.warn('[SW] registration failed:', err);
              });
          });
        }

        // ── 공통: 이미 standalone(홈 화면 앱)이면 아무것도 안 함 ──
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        if (isStandalone) return;

        // ── 배너 하루 이내 닫은 경우 스킵 ──────────────────────
        var dismissed = localStorage.getItem('pwa_banner_dismissed');
        if (dismissed && Date.now() - Number(dismissed) < 86400000) return;

        // ── iOS 감지 ────────────────────────────────────────
        var ua = navigator.userAgent || '';
        var isIOS = /iPhone|iPad|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS/.test(ua);

        if (isIOS) {
          // iOS: Safari인 경우에만 안내 (Chrome 등은 설치 불가)
          if (!isSafari) return;
          var iosBanner = document.getElementById('ios-install-banner');
          var iosCloseBtn = document.getElementById('ios-install-close-btn');
          // 2초 후 배너 표시
          setTimeout(function () {
            if (iosBanner) iosBanner.classList.add('visible');
          }, 2000);
          if (iosCloseBtn) {
            iosCloseBtn.addEventListener('click', function () {
              iosBanner.classList.remove('visible');
              localStorage.setItem('pwa_banner_dismissed', Date.now().toString());
            });
          }
          return;
        }

        // ── 안드로이드 / 데스크탑 Chrome: beforeinstallprompt ──
        var deferredPrompt = null;
        var banner = document.getElementById('pwa-install-banner');
        var installBtn = document.getElementById('pwa-install-btn');
        var closeBtn = document.getElementById('pwa-install-close');

        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredPrompt = e;
          setTimeout(function () {
            if (banner) banner.classList.add('visible');
          }, 2000);
        });

        if (installBtn) {
          installBtn.addEventListener('click', function () {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function (result) {
              if (result.outcome === 'accepted') {
                localStorage.setItem('pwa_installed', '1');
              }
              deferredPrompt = null;
              if (banner) banner.classList.remove('visible');
            });
          });
        }

        if (closeBtn) {
          closeBtn.addEventListener('click', function () {
            if (banner) banner.classList.remove('visible');
            localStorage.setItem('pwa_banner_dismissed', Date.now().toString());
          });
        }

        window.addEventListener('appinstalled', function () {
          localStorage.setItem('pwa_installed', '1');
          if (banner) banner.classList.remove('visible');
        });
      })();
    </script>
  </body>
</html>
