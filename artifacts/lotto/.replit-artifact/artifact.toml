kind = "web"
previewPath = "/"
title = "로또 번호 추출기"
version = "1.0.0"
id = "artifacts/lotto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25229

[services.development]
run = "pnpm --filter @workspace/lotto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lotto", "run", "build" ]
publicDir = "artifacts/lotto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25229"
BASE_PATH = "/"
